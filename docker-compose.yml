services:
  db:
    image: postgres:16-alpine
    container_name: macpoll-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: macpoll
      POSTGRES_PASSWORD: macpoll
      POSTGRES_DB: macpoll
    ports:
      - "5432:5432"
    volumes:
      - macpoll-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macpoll -d macpoll"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  macpoll-data:
